[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dualsimplex-py"
version = "0.1.0"
description = "sklearn-style Python wrapper around the R DualSimplex deconvolution package"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "did10" },
]
keywords = [
    "deconvolution",
    "nmf",
    "non-negative matrix factorization",
    "dualsimplex",
    "bulk rna-seq",
    "cell-type deconvolution",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Homepage = "https://github.com/did10/py-dualsimplex"
Repository = "https://github.com/did10/py-dualsimplex"
Issues = "https://github.com/did10/py-dualsimplex/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dualsimplex_py" = ["_r/*.R"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: requires R and the DualSimplex R package (skipped automatically when unavailable)",
]
